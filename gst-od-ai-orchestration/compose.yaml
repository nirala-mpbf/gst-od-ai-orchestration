services:
  ai-orchestration:
    build: .
    ports:
      - "8080:8080"
    environment:
      AGENTSCOPE_WORKSPACE: /app/agent-workspace
      AGENTSCOPE_MODEL: ${AGENTSCOPE_MODEL:-openai:gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-placeholder}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./agent-workspace:/app/agent-workspace:ro
    # Join the network hosting AgentGateway or change tools.json URL accordingly.
